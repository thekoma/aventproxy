[project]
name = "philips-avent-ha"
version = "0.1.0"
description = "Home Assistant integration for Philips Avent Baby Monitor"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Pin the rules the project enforces. Without this, `ruff check` inherits
# whatever the installed ruff version happens to default to, so a new ruff
# release turns CI red on untouched code, which is what ruff 0.16 did here.
select = [
    "E4", "E7", "E9", "F",  # pycodestyle errors + pyflakes
    "I",                    # import order
    "UP",                   # pyupgrade
    "SIM",                  # flake8-simplify
    "PERF",                 # perflint
    "PLW",                  # pylint warnings
    "RUF",                  # ruff-specific
    "EXE",                  # shebang / executable-bit consistency
    "BLE",                  # blind excepts, each survivor carries a noqa reason
    "S110",                 # try/except/pass, which hides real failures
]

[tool.ruff.lint.per-file-ignores]
# Development scripts: reverse-engineering aids, run by hand, not shipped to
# users. Broad excepts and asserts are the point in a probe script.
"tools/*" = ["BLE001", "S110", "SIM105", "PLW0603"]
"examples/*" = ["BLE001"]
