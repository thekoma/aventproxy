[project]
name = "philips-avent-ha"
version = "0.1.0"
description = "Home Assistant integration for Philips Avent Baby Monitor"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Pin the rule set the project actually enforces (pycodestyle errors +
# pyflakes). Without this, `ruff check` inherits whatever the installed ruff
# version happens to default to, so a new ruff release turns CI red on
# untouched code — which is exactly what ruff 0.16 did here.
select = ["E4", "E7", "E9", "F"]
