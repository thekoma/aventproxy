configuration:
  rtsp_bind_address:
    name: RTSP bind address
    description: >-
      Where the RTSP server listens. It has no password, so anyone who can reach
      the port can watch and hear the camera. Keep "localhost" (127.0.0.1 and ::1):
      Home Assistant runs on the same host and reaches the stream at
      rtsp://localhost:38554. Use 0.0.0.0 (every interface), one address or a
      comma-separated list only when another machine (VLC, Frigate, a separate
      go2rtc) must open the stream, and then restrict the port on your network.
  speaker_off:
    name: Keep the monitor's speaker off
    description: >-
      Ask the monitor to keep its speaker closed while Home Assistant watches,
      so a playing lullaby is not paused (issue #72, experimental).
  webrtc_audio:
    name: Audio requested from the monitor
    description: >-
      Audio requested from the monitor on cloud sessions: recvonly (default) or
      none (video only, for testing issue #72).
  cloud_transport:
    name: Cloud transport
    description: >-
      How streams that do not take the LAN connect through the cloud. webrtc
      (default) is the session every card has used. imm first tries the
      Philips app's own transport over cloud signalling, then falls back to
      webrtc. Experimental, tested on one SCD973 so far (issues #72 and #59).
