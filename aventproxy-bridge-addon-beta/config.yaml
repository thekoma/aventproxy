name: "Philips Avent WebRTC Bridge Beta (Addon)"
description: "WebRTC to RTSP bridge for Philips Avent baby monitors. Beta channel: required when the integration is a beta or rc build, because the two sides must match."
version: "2026.11.0-rc2"
slug: "aventproxy_bridge_beta"
image: "ghcr.io/thekoma/aventproxy-bridge"
url: "https://github.com/thekoma/aventproxy"
arch:
  - amd64
  - aarch64
homeassistant: "2024.1.0"
stage: experimental
host_network: true
apparmor: true
options:
  cameras: []
  rtsp_bind_address: "localhost"
  cloud_transport: "webrtc"
  talkback_mode: "on_demand"
schema:
  rtsp_bind_address: str?
  cloud_transport: list(webrtc|imm)?
  talkback_mode: list(on_demand|session)?
  signing_key: str?
  sid: str?
  ecode: str?
  partner: str?
  app_key: str?
  device_id: str?
  package_name: str?
  api_host: str?
  talkback: bool?
  cameras:
    - camera_id: str?
      camera_name: str?
startup: "application"
boot: "auto"
environment:
  WAIT_FOR_CONFIG: "true"
map:
  - config:rw
