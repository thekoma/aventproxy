configuration:
  rtsp_bind_address:
    name: Adres nasłuchu RTSP
    description: >-
      Na jakim interfejsie nasłuchuje serwer RTSP. Serwer nie ma hasła, więc każdy,
      kto dosięgnie portu, widzi i słyszy obraz z kamery. Zostaw "localhost"
      (127.0.0.1 i ::1): Home Assistant działa na tym samym hoście i otwiera strumień
      przez rtsp://localhost:38554. Wpisz 0.0.0.0 (wszystkie interfejsy), jeden adres
      albo listę po przecinku tylko wtedy, gdy strumień ma otwierać inna maszyna
      (VLC, Frigate, osobne go2rtc) — i wtedy ogranicz dostęp do portu w sieci.
  cloud_transport:
    name: Połączenie przez chmurę
    description: >-
      Jak łączą się przez chmurę strumienie, które nie idą przez sieć lokalną.
      webrtc (domyślnie) to sesja, której używają wszystkie karty. imm najpierw
      próbuje własnego transportu aplikacji Philips z sygnalizacją przez chmurę,
      a gdy się nie uda, wraca do webrtc. Eksperymentalne, dotąd sprawdzone
      na jednym SCD973 (zgłoszenia #72 i #59).
  talkback_mode:
    name: Tryb mówienia do dziecka
    description: >-
      Działa tylko wtedy, gdy w integracji włączony jest dźwięk dwukierunkowy
      (talkback). on_demand (tu domyślnie) zostawia sesję z kamerą
      jednokierunkową i otwiera sesję dwukierunkową tylko wtedy, gdy klient
      wysyła dźwięk, na przykład Home Assistant 2026.11 z włączonym
      mikrofonem. session prosi kamerę o dźwięk dwukierunkowy przy każdym
      strumieniu, co wstrzymuje grającą kołysankę (zgłoszenie #72).
      Eksperymentalne.
