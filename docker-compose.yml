services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    network_mode: host
    privileged: true
    volumes:
      - ha_config:/config
      - ./custom_components/philips_avent:/config/custom_components/philips_avent:ro
    environment:
      - TZ=Europe/Rome
      - BRIDGE_PORT=38554

  aventproxy-bridge:
    build:
      context: .
      dockerfile: docker/Dockerfile.bridge
    restart: unless-stopped
    network_mode: host
    volumes:
      - ha_config:/config:ro
    environment:
      - WAIT_FOR_CONFIG=true
      - BRIDGE_PORT=38554
      # RTSP has no authentication: loopback only by default. Set 0.0.0.0 only
      # when Home Assistant is not on this host's network.
      - RTSP_BIND_ADDRESS=localhost
    depends_on:
      - homeassistant

volumes:
  ha_config:
